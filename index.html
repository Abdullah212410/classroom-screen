
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2">
    <title>Classroom Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['class', '[data-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              primary: 'var(--c-primary)',
              'primary-hover': 'var(--c-primary-hover)',
              focus: 'var(--c-focus)',
              'focus-light': 'var(--c-focus-light)',
              'bg-main': 'var(--c-bg-main)',
              'bg-alt': 'var(--c-bg-alt)',
              'border-default': 'var(--c-border)',
              'text-main': 'var(--c-text-main)',
              'text-secondary': 'var(--c-text-secondary)',
            },
            borderRadius: {
              'card': 'var(--radius-lg)',
              'pill': 'var(--radius-full)',
            },
            boxShadow: {
              'soft': 'var(--shadow-sm)',
              'floating': 'var(--shadow-lg)',
              'glow': 'var(--shadow-glow)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* --- Brand Colors --- */
        --color-primary-main: #ed3b91;
        --color-primary-hover: #d6257a;
        
        /* --- Interaction --- */
        --color-interaction-focus: #08b8fb;
        --color-interaction-focus-light: rgba(8, 184, 251, 0.2);

        /* --- Neutrals --- */
        --color-neutral-text-main: #091e42;
        --color-neutral-text-secondary: #6882a9;
        
        --color-neutral-bg-main: #ffffff;
        --color-neutral-bg-alt: #f8fafc;
        --color-neutral-bg-overlay: rgba(30, 41, 59, 0.9);
        
        --color-neutral-border: #e2e8f0;
        --color-neutral-border-hover: #cbd5e1;

        /* --- Status --- */
        --color-status-success: #22c55e;
        --color-status-warning: #f59e0b;
        --color-status-danger: #ef4444;

        /* --- Typography --- */
        --font-family-base: 'Inter', system-ui, -apple-system, sans-serif;

        /* --- Radius --- */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius-full: 9999px;

        /* --- Shadows --- */
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-glow: 0 0 20px rgba(237, 59, 145, 0.15);

        /* --- Animation --- */
        --anim-duration-fast: 150ms;
        --anim-duration-normal: 300ms;
        --anim-duration-slow: 700ms;
        --anim-curve-default: cubic-bezier(0.4, 0, 0.2, 1);
        --anim-curve-entry: cubic-bezier(0.16, 1, 0.3, 1);

        /* --- LEGACY MAPPINGS --- */
        --c-primary: var(--color-primary-main);
        --c-primary-hover: var(--color-primary-hover);
        --c-focus: var(--color-interaction-focus);
        --c-focus-light: var(--color-interaction-focus-light);
        --c-text-main: var(--color-neutral-text-main);
        --c-text-secondary: var(--color-neutral-text-secondary);
        --c-bg-main: var(--color-neutral-bg-main);
        --c-bg-alt: var(--color-neutral-bg-alt);
        --c-bg-overlay: var(--color-neutral-bg-overlay);
        --c-border: var(--color-neutral-border);
        --c-border-hover: var(--color-neutral-border-hover);
        --c-success: var(--color-status-success);
        --c-warning: var(--color-status-warning);
        --c-danger: var(--color-status-danger);
      }

      [data-theme="dark"] {
        --color-neutral-text-main: #f8fafc;
        --color-neutral-text-secondary: #94a3b8;
        --color-neutral-bg-main: #1e293b;
        --color-neutral-bg-alt: #0f172a;
        --color-neutral-border: #334155;
        --color-neutral-border-hover: #475569;
        --color-neutral-bg-overlay: rgba(30, 41, 59, 0.9);
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--c-bg-alt);
        color: var(--c-text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      #root {
        height: 100%;
        background-image: url('https://images.unsplash.com/photo-1483664852095-d6cc68707056?auto=format&fit=crop&w=1920&q=80');
        background-size: cover;
        background-position: center;
      }

      /* Base Widget styles using new vars */
      .widget-card {
        background: var(--c-bg-main);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--c-border);
        transition: background 0.3s ease, border-color 0.3s ease;
        color: var(--c-text-main);
      }

      /* Dragging state - applied directly for instant feedback */
      .is-dragging {
        cursor: grabbing !important;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1) !important;
        transition: none !important;
        will-change: transform;
        border: 2px solid var(--c-focus) !important;
      }

      .is-dragging * {
        cursor: grabbing !important;
      }

      /* Smooth widget resize transitions */
      .widget-card:not(.is-dragging) {
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.2s ease,
                    border-color 0.3s ease;
      }

      .toolbar-pill {
        background: var(--c-bg-main);
        backdrop-filter: blur(10px);
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--c-border);
      }

      .popover-card {
        background: var(--c-bg-main);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--c-border);
        color: var(--c-text-main);
      }

      .widget-drag-handle {
        cursor: grab;
      }
      .widget-drag-handle:active {
        cursor: grabbing;
      }
      
      .resize-handle {
        cursor: nwse-resize;
        width: 24px;
        height: 24px;
        position: absolute;
        bottom: 0;
        right: 0;
        z-index: 50;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 4px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .widget-card:hover .resize-handle {
        opacity: 1;
      }
      .resize-handle::after {
        content: "";
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--c-text-secondary);
        border-bottom: 2px solid var(--c-text-secondary);
        border-radius: 0 0 2px 0;
      }
      
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Toolbar Responsive Enhancements */
      .toolbar-container {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
      }

      .toolbar-container > * {
        scroll-snap-align: start;
      }

      /* Ensure touch targets >= 44px */
      @media (max-width: 768px) {
        .toolbar-container button {
          min-height: 44px;
          min-width: 44px;
        }
      }

      /* Design Token Application - Toolbar Styling */
      .toolbar-container {
        background: var(--color-neutral-bg-main);
        border: 1px solid var(--color-neutral-border);
        box-shadow: var(--shadow-md), var(--shadow-glow);
        border-radius: var(--radius-xl);
        transition: all var(--anim-duration-normal) var(--anim-curve-default);
      }

      .toolbar-container:hover {
        box-shadow: var(--shadow-lg), var(--shadow-glow);
        border-color: var(--color-neutral-border-hover);
      }

      /* Active/Primary Actions */
      .toolbar-container .bg-primary {
        background-color: var(--color-primary-main) !important;
        box-shadow: var(--shadow-glow);
        transition: all var(--anim-duration-fast) var(--anim-curve-entry);
      }

      .toolbar-container .bg-primary:hover {
        background-color: var(--color-primary-hover) !important;
        transform: translateY(-1px);
      }

      .toolbar-container .bg-primary:active {
        transform: translateY(0);
      }

      /* Focus States */
      .toolbar-container .bg-focus-light {
        background-color: var(--color-interaction-focus-light) !important;
        color: var(--color-interaction-focus) !important;
      }

      .toolbar-container button:focus-visible {
        outline: 2px solid var(--color-interaction-focus);
        outline-offset: 2px;
        box-shadow: 0 0 0 4px var(--color-interaction-focus-light);
      }

      /* Text Colors */
      .toolbar-container {
        color: var(--color-neutral-text-main);
      }

      .toolbar-container .text-gray-400 {
        color: var(--color-neutral-text-secondary) !important;
      }

      .toolbar-container .text-gray-600 {
        color: var(--color-neutral-text-main) !important;
      }

      /* Borders */
      .toolbar-container .border-gray-100,
      .toolbar-container .border-gray-200 {
        border-color: var(--color-neutral-border) !important;
      }

      /* Background Hovers */
      .toolbar-container .hover\:bg-gray-100:hover,
      .toolbar-container .hover\:bg-gray-50:hover {
        background-color: var(--color-neutral-bg-alt) !important;
      }

      /* Rounded Corners - Crisp and Modern */
      .toolbar-container button {
        border-radius: var(--radius-xl);
      }

      .toolbar-container .rounded-2xl {
        border-radius: var(--radius-xl);
      }

      .toolbar-container .rounded-xl {
        border-radius: var(--radius-lg);
      }

      /* Separators */
      .toolbar-container > div > .bg-gray-200,
      .toolbar-container > div > .bg-gray-300 {
        background-color: var(--color-neutral-border) !important;
      }

      /* Smooth Transitions */
      .toolbar-container button,
      .toolbar-container > * {
        transition: all var(--anim-duration-fast) var(--anim-curve-default);
      }

      /* Entry Animation */
      @keyframes slideInFromBottom {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .toolbar-container {
        animation: slideInFromBottom var(--anim-duration-normal) var(--anim-curve-entry);
      }

      /* Accessibility - High Contrast Focus */
      @media (prefers-contrast: high) {
        .toolbar-container button:focus-visible {
          outline-width: 3px;
          outline-offset: 3px;
        }
      }

      /* Clarity Over Decoration */
      .toolbar-container {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      /* Dark Mode Support */
      [data-theme="dark"] .toolbar-container {
        background: var(--color-neutral-bg-main);
        border-color: var(--color-neutral-border);
      }

      [data-theme="dark"] .toolbar-container:hover {
        border-color: var(--color-neutral-border-hover);
      }

      /* Z-Index Hierarchy - Prevent Overlapping */
      .widget-card {
        z-index: 10;
        position: relative;
      }

      .widget-card:hover {
        z-index: 20;
      }

      /* Ensure drawing toolbar always on top */
      .toolbar-container {
        z-index: 300 !important;
        position: relative;
      }

      /* Safe spacing on mobile to prevent toolbar overlap */
      @media (max-width: 768px) {
        .toolbar-container {
          margin-bottom: max(env(safe-area-inset-bottom), 16px);
        }

        /* Add padding to widget container on mobile to prevent overlap with bottom toolbar */
        body {
          padding-bottom: 120px;
        }
      }

      input:focus, textarea:focus {
        outline: none;
      }
      
      canvas {
        touch-action: none;
      }
    </style>
<script type="importmap">
{

    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "react": "https://esm.sh/react@^19.2.4"

</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
